  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            np: {
              paper: '#F4F1E8',
              ink: '#141210',
              sub: '#4A453D',
              mute: '#7C756B',
              rule: '#141210',
              red: '#B3261E',
              tint: '#E9E4D6',
            }
          },
          fontFamily: {
            serif: ['"Noto Serif JP"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'serif'],
            sans: ['"Noto Sans JP"', '"Hiragino Sans"', '"Yu Gothic UI"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F4F1E8; }
    .rule-double { border-top: 3px solid #141210; border-bottom: 1px solid #141210; height: 6px; }
    .dropcap::first-letter { float: left; font-size: 3.3rem; line-height: .82; padding: .15rem .5rem .1rem 0; font-weight: 900; }
    @media print {
      .no-print { display: none !important; }
      body { background-color: #FFFFFF; }
      figure, li { break-inside: avoid; }
      .md\:columns-2 { columns: 2 !important; }
      .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .md\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
      .md\:grid-cols-\[1fr_auto_1fr\] { grid-template-columns: 1fr auto 1fr !important; }
      .hidden.md\:block { display: block !important; }
      .md\:hidden { display: none !important; }
    }
  </style>
</head>
<body class="font-serif text-np-ink antialiased">
  <div class="no-print max-w-3xl mx-auto px-5 pt-2 flex justify-end">
    <button onclick="window.print()" class="font-sans text-[11px] tracking-[0.2em] text-np-mute hover:text-np-red transition-colors cursor-pointer">PDF</button>
  </div>
  <main class="max-w-3xl mx-auto px-5 py-10 md:py-14">
